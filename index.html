<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>돌로미티 숙소 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">🏔️ 돌로미티 숙소 투표</h1>
      <span class="text-xs bg-indigo-700 px-2 py-1 rounded">기본 모드</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- 사용자 이름 입력 -->
    <div class="bg-white p-4 rounded-xl shadow-sm">
      <label class="block text-sm font-semibold text-slate-700 mb-1">👤 투표자 이름:</label>
      <input type="text" id="userNameInput" placeholder="이름을 입력하세요" class="w-full md:w-64 p-2 border rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
    </div>

    <!-- 탭 메뉴 -->
    <div class="flex bg-white rounded-t-xl overflow-hidden shadow-sm border-b">
      <button id="btn7" onclick="changeTab('7nights')" class="flex-1 py-3 font-bold text-indigo-600 border-b-2 border-indigo-600">🗓️ 7박 코스 (9/11~9/18)</button>
      <button id="btn3" onclick="changeTab('3nights')" class="flex-1 py-3 font-bold text-slate-500 border-b-2 border-transparent">🗓️ 3박 코스 (9/18~9/21)</button>
    </div>

    <!-- 숙소 리스트 출력 공간 -->
    <div id="listContainer" class="space-y-4">
      <!-- 자바스크립트가 여기에 숙소 카드를 강제로 꽂아넣습니다 -->
    </div>

  </main>

  <script>
    // 15개 숙소 데이터 (사진 파일명 포함)
    const accommodations = [
      { id: '1', category: '7nights', name: '1. Trafuns HOF 아파트', location: '볼차노', price: '190만', beds: '2', features: '발코니 뷰 끝내줌', url: 'https://www.trafunshof.com/en/online-booking', img: './1.jpg' },
      { id: '2', category: '7nights', name: '2. Innergost Hof 롯지', location: '볼차노', price: '170만', beds: '2', features: '발코니 뷰 끝내줌. 예약 대기', url: 'https://www.innergosthof.com/en/', img: './2.jpg' },
      { id: '3', category: '7nights', name: '3. Oberzerod 아파트', location: '볼차노', price: '220만', beds: '2', features: '발코니 뷰 끝내줌', url: 'https://www.oberzerod.com/en/living/panorama/', img: './3.jpg' },
      { id: '4', category: '7nights', name: '4. Seis am Schlern 콘도', location: '볼차노', price: '220만', beds: '3', features: '발코니 뷰 끝내줌', url: 'https://www.airbnb.co.kr/rooms/51579894', img: './4.jpg' },
      { id: '5', category: '7nights', name: '5. Caprile-Alleghe 집', location: '볼차노', price: '250만', beds: '3', features: '발코니 산악뷰 끝내줌', url: 'https://www.airbnb.co.kr/rooms/1421801906851702421', img: './5.jpg' },
      { id: '6', category: '7nights', name: '6. Pecol 살레', location: '볼차노', price: '310만', beds: '3', features: '발코니 산악뷰 좋음', url: 'https://www.airbnb.co.kr/rooms/45331024', img: './6.jpg' },
      { id: '7', category: '7nights', name: '7. Sass Dlacia 캠핑장 롯지', location: '친퀘토리', price: '300만', beds: '2+소파베드', features: '대형 캠핑장 시설 사용 가능', url: 'https://campingsassdlacia.it/en', img: './7.jpg' },
      { id: '8', category: '7nights', name: '8. La Villa 아파트 (크레파츠)', location: '친퀘토리', price: '210만', beds: '3', features: '산악뷰 끝내주나 집 뒷편임', url: 'https://www.airbnb.co.kr/rooms/794028618594637814', img: './8.jpg' },
      { id: '9', category: '7nights', name: '9. San Ciascian 아파트 (알타 바디아)', location: '친퀘토리', price: '230만', beds: '2', features: '마당 잔디밭', url: 'https://www.airbnb.co.kr/rooms/1700733378054490736', img: './9.jpg' },
      { id: '10', category: '7nights', name: '10. La Villa 아파트', location: '친퀘토리', price: '290만', beds: '3', features: '발코니 뷰 끝내줌', url: 'https://www.airbnb.co.kr/rooms/31139263', img: './10.jpg' },
      { id: '11', category: '3nights', name: '11. Fie allo Scillar 아파트 (오팔)', location: '볼차노', price: '120만', beds: '2+소파베드', features: '정원뷰 좋음+완전 신식', url: 'https://www.airbnb.co.kr/rooms/655454393790746501', img: './11.jpg' },
      { id: '12', category: '3nights', name: '12. Vols am Schlern 아파트', location: '볼차노', price: '150만', beds: '3+소파베드', features: '부엌 산악뷰. 발코니 없음', url: 'https://www.airbnb.co.kr/rooms/39777287', img: './12.jpg' },
      { id: '13', category: '3nights', name: '13. Vols am Schlern 별장', location: '볼차노', price: '110만', beds: '2+소파베드', features: '시골집 스타일, 마당 뷰', url: 'https://www.airbnb.co.kr/rooms/707028084921852031', img: './13.jpg' },
      { id: '14', category: '3nights', name: '14. Badia 아파트', location: '친퀘토리', price: '120만', beds: '4', features: '광폭 발코니 산악 사이드뷰', url: 'https://www.airbnb.co.kr/rooms/1170131398830189930', img: './14.jpg' },
      { id: '15', category: '3nights', name: '15. San Ciascian 아파트', location: '친퀘토리', price: '160만', beds: '3+소파베드', features: '산악 사이드뷰', url: 'https://www.airbnb.co.kr/rooms/914397442379820144', img: './15.jpg' }
    ];

    let currentTab = '7nights';

    // 페이지 켜지자마자 실행
    window.onload = function() {
      renderList();
    };

    function changeTab(tab) {
      currentTab = tab;
      document.getElementById('btn7').className = tab === '7nights' ? "flex-1 py-3 font-bold text-indigo-600 border-b-2 border-indigo-600" : "flex-1 py-3 font-bold text-slate-500 border-b-2 border-transparent";
      document.getElementById('btn3').className = tab === '3nights' ? "flex-1 py-3 font-bold text-indigo-600 border-b-2 border-indigo-600" : "flex-1 py-3 font-bold text-slate-500 border-b-2 border-transparent";
      renderList();
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      const filtered = accommodations.filter(item => item.category === currentTab);

      container.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-slate-200">
          <div class="h-48 bg-slate-100">
            <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.src='https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80'">
          </div>
          <div class="p-4 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs bg-slate-100 px-2 py-0.5 rounded text-slate-600 font-semibold">${item.location}</span>
                <h3 class="font-bold text-base text-slate-800 inline ml-1">${item.name}</h3>
              </div>
              <span class="text-indigo-600 font-bold">${item.price}</span>
            </div>
            <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded">✨ ${item.features}</p>
            <div class="flex justify-between items-center text-xs text-slate-500 pt-2 border-t">
              <span>🛏️ 침대: ${item.beds}</span>
              <a href="${item.url}" target="_blank" class="text-indigo-600 font-bold underline">숙소 상세 보기 🔗</a>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
