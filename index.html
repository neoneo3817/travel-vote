      {"category": "como", "user_name": "지현", "rank_1": "como-5", "rank_2": "3"},
      {"category": "final", "user_name": "고상", "rank_1": "combo_1", "rank_2": "1"},
      {"category": "final", "user_name": "고상", "rank_1": "combo_2", "rank_2": "3"},
      {"category": "final", "user_name": "고상", "rank_1": "combo_3", "rank_2": "2"},

      {"category": "final", "user_name": "란", "rank_1": "combo_2", "rank_2": "2"},
      {"category": "final", "user_name": "란", "rank_1": "combo_3", "rank_2": "3"},
      {"category": "final", "user_name": "지현", "rank_1": "combo_1", "rank_2": "2"},
      {"category": "final", "user_name": "지현", "rank_1": "combo_2", "rank_2": "3"},
      {"category": "final", "user_name": "지현", "rank_1": "combo_3", "rank_2": "1"}
    ];

    const accommodations = [...FINAL_COMBOS, ...ACC_DATA, ...COMO_DATA];
    let currentCategory = 'como';
    const TITLES = { como: '🇮🇹 3차 투표 · 꼬모 숙소 후보', final: '🏆 결선 투표 조합 리스트', '7nights': '🏡 7박 숙소 후보', '3nights': '🏡 3박 숙소 후보' };

    window.addEventListener('DOMContentLoaded', () => switchCategory('como'));

    function switchCategory(cat) {
      currentCategory = cat;
      const tabIds = { como: 'tabComo', final: 'tabFinal', '7nights': 'tab7nights', '3nights': 'tab3nights' };
      Object.entries(tabIds).forEach(([k, id]) => {
        document.getElementById(id).className = "flex-1 py-3 font-bold text-center border-b-2 cursor-pointer text-xs md:text-sm " +
          (k === cat ? "border-indigo-600 text-indigo-600" : "border-transparent text-slate-500 hover:text-slate-700");
      });
      document.getElementById('listTitle').innerText = TITLES[cat];
      document.getElementById('boardTitle').innerText = cat === 'final' ? "📊 참가자별 선호 순위 결과" : "📊 최종 총점";
      renderAccommodations();
      renderResults();
    }

    function renderAccommodations() {
      const listEl = document.getElementById('accommodationsList');
      const filtered = accommodations.filter(item => item.category === currentCategory);
      if (currentCategory === 'final') {
        listEl.innerHTML = filtered.map(item => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3">
            <div><span class="text-xs font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded mr-2">${item.location}</span>
              <h3 class="font-bold text-base text-slate-800 inline">${item.name}</h3></div>
            <div class="bg-slate-50 p-3 rounded-lg space-y-1 text-xs">
              <div><span class="font-semibold text-slate-700">📌 7박 숙소:</span> <a href="${item.acc1_url}" target="_blank" class="text-indigo-600 hover:underline font-bold">${item.acc1_name} 🔗</a></div>
              <div><span class="font-semibold text-slate-700">📌 3박 숙소:</span> <a href="${item.acc2_url}" target="_blank" class="text-indigo-600 hover:underline font-bold">${item.acc2_name} 🔗</a></div>
            </div>
            <p class="text-xs text-amber-700 bg-amber-50 p-2.5 rounded font-semibold">${item.notes}</p>
          </div>`).join('');
      } else {
        listEl.innerHTML = filtered.map(item => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="w-full aspect-[4/3] bg-slate-100 overflow-hidden"><img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover"></div>
            <div class="p-4 space-y-2">
              <div class="flex justify-between items-start">
                <div><span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded mr-2">${item.location || '위치'}</span>
                  ${item.url ? `<a href="${item.url}" target="_blank" class="font-bold text-base text-slate-800 hover:text-indigo-600 hover:underline inline">${item.name} 🔗</a>` : `<h3 class="font-bold text-base text-slate-800 inline">${item.name}</h3>`}</div>
                <span class="text-indigo-600 font-bold text-sm">${item.price || '가격문의'}</span>
              </div>
              <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded">✨ ${item.features || '특이사항 없음'}</p>
              <div class="text-xs text-slate-500">🛏️ 침실 ${item.bedrooms || '-'} | 침대 ${item.beds || '-'} | 🚿 화장실 ${item.bathrooms || '-'}</div>
            </div>
          </div>`).join('');
      }
    }

    function renderResults() {
      const board = document.getElementById('resultsBoard');
      const categoryVotes = VOTES.filter(v => v.category === currentCategory);

      if (currentCategory === 'final') {
        const userMap = {};
        categoryVotes.forEach(v => {
          (userMap[v.user_name] = userMap[v.user_name] || []).push({
            rank: parseInt(v.rank_2) || 99,
            name: (FINAL_COMBOS.find(c => c.id === v.rank_1) || { name: v.rank_1 }).name
          });
        });
        const users = Object.keys(userMap);
        board.innerHTML = `<div class="text-xs text-slate-500 mb-3">총 결선 참여: <span class="font-bold text-indigo-600">${users.length}명</span></div>` +
          users.map(u => `
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1.5">
              <div class="font-bold text-xs text-indigo-700">👤 ${u}</div>
              ${userMap[u].sort((a, b) => a.rank - b.rank).map(i => `
                <div class="flex items-center justify-between bg-white px-2.5 py-1 rounded border border-slate-100 text-xs">
                  <span class="text-[10px] px-1.5 py-0.5 rounded text-white font-bold ${i.rank === 1 ? 'bg-amber-500' : i.rank === 2 ? 'bg-slate-500' : 'bg-amber-800'}">${i.rank}순위</span>
                  <span class="font-semibold text-slate-800">${i.name}</span>
                </div>`).join('')}
            </div>`).join('');
        return;
      }

      const filteredAcc = accommodations.filter(a => a.category === currentCategory);
      const scores = {};
      filteredAcc.forEach(a => scores[a.id] = 0);
      let unmatched = 0;
      categoryVotes.forEach(v => {
        const id = v.rank_1;
        if (scores[id] === undefined) { unmatched++; return; }
        scores[id] += parseInt(v.rank_2) || 0;
      });
      const uniqueUsers = new Set(categoryVotes.map(v => v.user_name)).size;
      const sorted = filteredAcc.map(a => ({ ...a, score: scores[a.id] })).sort((a, b) => b.score - a.score);
      const maxScore = Math.max(...sorted.map(s => s.score), 1);

      board.innerHTML = `<div class="text-xs text-slate-500 mb-2">총 평가 참여: <span class="font-bold text-indigo-600">${uniqueUsers}명</span></div>` +
        (unmatched ? `<div class="text-xs text-rose-600 bg-rose-50 p-2 rounded">⚠️ 숙소와 연결되지 않은 투표 ${unmatched}건</div>` : '') +
        sorted.map((item, idx) => `
          <div class="space-y-1">
            <div class="flex justify-between text-xs font-semibold">
              <span class="truncate max-w-[150px]">${idx === 0 && item.score > 0 ? '👑 ' : ''}${item.name}</span>
              <span class="text-indigo-600 font-bold">${item.score}점</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden"><div class="bg-indigo-600 h-2 rounded-full" style="width: ${(item.score / maxScore) * 100}%"></div></div>
          </div>`).join('');
    }
  </script>
