<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>돌로미티 숙소 결정 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-20">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">🏔️ 돌로미티 숙소 결정 투표</h1>
      <span id="connectionBadge" class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full border border-indigo-400">DB 연동 확인 중...</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- User Input Section -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-sm font-semibold text-slate-700 mb-2">👤 당신의 이름 (투표자 닉네임):</label>
      <input type="text" id="userNameInput" placeholder="예: 홍길동" class="w-full md:w-64 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
    </div>

    <!-- Category Tabs -->
    <div class="flex border-b border-slate-200 bg-white rounded-t-xl overflow-hidden shadow-sm">
      <button id="tab7nights" onclick="switchCategory('7nights')" class="flex-1 py-3 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer">
        🗓️ 7박 코스 (9/11 ~ 9/18)
      </button>
      <button id="tab3nights" onclick="switchCategory('3nights')" class="flex-1 py-3 font-bold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 cursor-pointer">
        🗓️ 3박 코스 (9/18 ~ 9/21)
      </button>
    </div>

    <!-- Main Content Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Accommodations List -->
      <div class="lg:col-span-2 space-y-4">
        <div class="flex justify-between items-center">
          <h2 class="text-lg font-bold text-slate-800">🏡 숙소 후보 리스트</h2>
          <button onclick="toggleAddModal()" class="text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-1.5 px-3 rounded-lg shadow-sm cursor-pointer">
            + 새 숙소 추가
          </button>
        </div>
        
        <div id="accommodationsList" class="space-y-4"></div>

        <button onclick="submitVote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition cursor-pointer mt-4">
          🗳️ 선택한 순위로 투표 제출하기
        </button>
      </div>

      <!-- Live Dashboard -->
      <div class="lg:col-span-1">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 sticky top-4">
          <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
            📊 실시간 현황 판
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          </h2>
          <div id="resultsBoard" class="space-y-3"></div>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal: Add Accommodation -->
  <div id="addModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl space-y-3">
      <h3 class="text-lg font-bold">➕ 새 숙소 추가</h3>
      <input type="text" id="newName" placeholder="숙소 이름" class="w-full p-2 border rounded text-sm">
      <input type="text" id="newLocation" placeholder="위치 (예: 볼차노)" class="w-full p-2 border rounded text-sm">
      <div class="grid grid-cols-2 gap-2">
        <input type="text" id="newPrice" placeholder="가격 (예: 200만)" class="w-full p-2 border rounded text-sm">
        <input type="text" id="newFeatures" placeholder="특징 (예: 발코니 뷰)" class="w-full p-2 border rounded text-sm">
      </div>
      <div class="grid grid-cols-3 gap-2">
        <input type="text" id="newBedrooms" placeholder="침실 수" class="w-full p-2 border rounded text-sm">
        <input type="text" id="newBeds" placeholder="침대 수" class="w-full p-2 border rounded text-sm">
        <input type="text" id="newBathrooms" placeholder="화장실 수" class="w-full p-2 border rounded text-sm">
      </div>
      <input type="text" id="newUrl" placeholder="예약 링크 URL" class="w-full p-2 border rounded text-sm">
      <input type="text" id="newImg" placeholder="이미지 파일명 (예: ./16.jpg)" class="w-full p-2 border rounded text-sm">
      
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="toggleAddModal()" class="px-3 py-1.5 text-xs text-slate-600 cursor-pointer">취소</button>
        <button onclick="addAccommodation()" class="px-4 py-1.5 text-xs bg-emerald-600 text-white rounded font-bold cursor-pointer">등록하기</button>
      </div>
    </div>
  </div>
