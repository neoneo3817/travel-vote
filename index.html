    function initSupabase() {
      const badge = document.getElementById('connectionBadge');
      try {
        if (typeof supabase !== 'undefined' && SUPABASE_URL) {
          supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          if (badge) badge.innerText = "실시간 DB 연동중 🟢";
          loadDataFromSupabase();
          subscribeRealtime();
        } else {
          if (badge) badge.innerText = "로컬 모드 🟡";
        }
      } catch (e) {
        console.warn("Supabase 초기화 예외:", e);
        if (badge) badge.innerText = "기본 모드 🟡";
      }
    }

    async function loadDataFromSupabase() {
      if (!supabaseClient) return;
      try {
        // 서버 DB의 accommodations 테이블 데이터를 먼저 가져오고, 없으면 FALLBACK_DATA 유지
        let { data: accData, error: accErr } = await supabaseClient.from('accommodations').select('*');
        if (!accErr && accData && accData.length > 0) {
          // DB에 저장된 이미지 경로(`./1.jpg` 등)를 올바른 GitHub Raw URL로 자동 보정
          const fixedAccData = accData.map(item => {
            if (item.img && item.img.startsWith('./')) {
              const num = item.img.replace('./', '').replace('.jpg', '');
              item.img = `https://raw.githubusercontent.com/neoneo3817/travel-vote/main/${num}.jpg`;
            }
            return item;
          });
          const hasComoInDatabase = fixedAccData.some(item => item.category === 'como');
          accommodations = [...FINAL_COMBOS, ...fixedAccData, ...(hasComoInDatabase ? [] : COMO_DATA)];
        }

        let { data: voteData, error: voteErr } = await supabaseClient.from('votes').select('*');
        if (!voteErr && voteData) {
          votes = voteData;
        }

        renderAccommodations();
        renderResults();
      } catch (err) {
        console.warn("DB 로딩 실패:", err);
      }
    }

    function subscribeRealtime() {
      if (!supabaseClient) return;
      try {
        supabaseClient
          .channel('public:all_changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'votes' }, () => { loadDataFromSupabase(); })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'accommodations' }, () => { loadDataFromSupabase(); })
          .subscribe();
      } catch (e) {
        console.warn("실시간 구독 실패:", e);
      }
    }

    function switchCategory(cat) {
      currentCategory = cat;
      mySelections = {};

      const tabIds = { como: 'tabComo', final: 'tabFinal', '7nights': 'tab7nights', '3nights': 'tab3nights' };
      Object.values(tabIds).forEach(id => {
        const btn = document.getElementById(id);
        if (id === tabIds[cat]) {
          btn.className = "flex-1 py-3 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer text-xs md:text-sm";
        } else {
          btn.className = "flex-1 py-3 font-bold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 cursor-pointer text-xs md:text-sm";
        }
      });

      document.getElementById('inputNotice').innerText = cat === 'final' 
        ? "💡 3가지 결선 조합 중 각각 1순위, 2순위, 3순위를 모두 고르고 제출해 주세요!" 
        : "💡 각 숙소마다 생각하시는 점수(1~3점)를 선택해 주세요!";
      
      if (cat === 'como') document.getElementById('inputNotice').innerText = "💡 꼬모 숙소 5곳을 각각 1~3점으로 평가해 주세요! 점수 합계가 높은 숙소가 위에 표시됩니다.";
      document.getElementById('listTitle').innerText = cat === 'como' ? "🇮🇹 3차 투표 · 꼬모 숙소 후보" : cat === 'final' ? "🏆 결선 투표 조합 리스트" : "🏡 숙소 후보 리스트";
      document.getElementById('addBtn').style.display = cat === 'final' ? 'none' : 'block';
      document.getElementById('boardTitle').innerText = cat === 'final' ? "📊 참가자별 선호 순위 결과" : "📊 실시간 총점 현황";

      renderAccommodations();
      renderResults();
    }

    function renderAccommodations() {
      const listEl = document.getElementById('accommodationsList');
      if (!listEl) return;

      const filtered = accommodations.filter(item => item.category === currentCategory);

      if (currentCategory === 'final') {
        listEl.innerHTML = filtered.map(item => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-3 hover:border-indigo-300 transition">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs font-semibold px-2 py-0.5 bg-indigo-50 text-indigo-600 rounded mr-2">${item.location}</span>
                <h3 class="font-bold text-base text-slate-800 inline">${item.name}</h3>
              </div>
            </div>
            
            <div class="bg-slate-50 p-3 rounded-lg space-y-1 text-xs">
              <div class="flex items-center gap-1">
                <span class="font-semibold text-slate-700">📌 7박 숙소:</span>
                <a href="${item.acc1_url}" target="_blank" class="text-indigo-600 hover:underline font-bold">${item.acc1_name} 🔗</a>
              </div>
              <div class="flex items-center gap-1">
                <span class="font-semibold text-slate-700">📌 3박 숙소:</span>
                <a href="${item.acc2_url}" target="_blank" class="text-indigo-600 hover:underline font-bold">${item.acc2_name} 🔗</a>
              </div>
            </div>

            <p class="text-xs text-amber-700 bg-amber-50 p-2.5 rounded font-semibold">${item.notes}</p>

            <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-100">
              <button onclick="setFinalRank('${item.id}', 1)" id="rank-1-${item.id}" class="py-2 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">🥇 1순위로 선택</button>
              <button onclick="setFinalRank('${item.id}', 2)" id="rank-2-${item.id}" class="py-2 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">🥈 2순위로 선택</button>
              <button onclick="setFinalRank('${item.id}', 3)" id="rank-3-${item.id}" class="py-2 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">🥉 3순위로 선택</button>
            </div>
          </div>
        `).join('');
        updateFinalButtons();
      } else {
        listEl.innerHTML = filtered.map(item => `
          <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:border-indigo-300 transition">
            <div class="w-full aspect-[4/3] bg-slate-100 overflow-hidden">
              <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover">
            </div>
            <div class="p-4 space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded mr-2">${item.location || '위치'}</span>
                  ${item.url ? `<a href="${item.url}" target="_blank" class="font-bold text-base text-slate-800 hover:text-indigo-600 hover:underline inline">${item.name} 🔗</a>` : `<h3 class="font-bold text-base text-slate-800 inline">${item.name}</h3>`}
                </div>
                <span class="text-indigo-600 font-bold text-sm">${item.price || '가격문의'}</span>
              </div>
              
              <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded">✨ ${item.features || '특이사항 없음'}</p>
              
              <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
                <span>🛏️ 침실 ${item.bedrooms || '-'} | 침대 ${item.beds || '-'} | 🚿 화장실 ${item.bathrooms || '-'}</span>
              </div>

              <div class="grid grid-cols-3 gap-2 pt-3 border-t border-slate-100">
                <button onclick="setScore('${item.id}', 1)" id="btn-1-${item.id}" class="py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">⭐ 1점</button>
                <button onclick="setScore('${item.id}', 2)" id="btn-2-${item.id}" class="py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">⭐⭐ 2점</button>
                <button onclick="setScore('${item.id}', 3)" id="btn-3-${item.id}" class="py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">⭐⭐⭐ 3점</button>
              </div>
            </div>
          </div>
        `).join('');
        updateScoreButtons();
      }
    }

    function setFinalRank(comboId, rank) {
      for (let id in mySelections) {
        if (mySelections[id] === rank) delete mySelections[id];
      }
      if (mySelections[comboId] === rank) {
        delete mySelections[comboId];
      } else {
        mySelections[comboId] = rank;
      }
      updateFinalButtons();
    }

    function updateFinalButtons() {
      FINAL_COMBOS.forEach(item => {
        for (let r = 1; r <= 3; r++) {
          const btn = document.getElementById(`rank-${r}-${item.id}`);
          if (!btn) continue;
          const assignedRank = mySelections[item.id];
          
          if (assignedRank === r) {
            btn.className = r === 1 ? "py-2 px-2 rounded-lg text-xs font-bold bg-amber-500 text-white shadow-sm cursor-pointer" :
                            r === 2 ? "py-2 px-2 rounded-lg text-xs font-bold bg-slate-500 text-white shadow-sm cursor-pointer" :
                                      "py-2 px-2 rounded-lg text-xs font-bold bg-amber-700 text-white shadow-sm cursor-pointer";
            btn.innerText = r === 1 ? "🥇 1순위 선택됨" : r === 2 ? "🥈 2순위 선택됨" : "🥉 3순위 선택됨";
          } else {
            btn.className = "py-2 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer";
            btn.innerText = r === 1 ? "🥇 1순위로 선택" : r === 2 ? "🥈 2순위로 선택" : "🥉 3순위로 선택";
          }
        }
      });
    }

    function setScore(accId, score) {
      if (mySelections[accId] === score) {
        delete mySelections[accId];
      } else {
        mySelections[accId] = score;
      }
      updateScoreButtons();
    }

    function updateScoreButtons() {
      const filtered = accommodations.filter(item => item.category === currentCategory);
      filtered.forEach(item => {
        const btn1 = document.getElementById(`btn-1-${item.id}`);
        const btn2 = document.getElementById(`btn-2-${item.id}`);
        const btn3 = document.getElementById(`btn-3-${item.id}`);
        const score = mySelections[item.id];

        if (btn1) btn1.className = score === 1 ? "py-1.5 px-2 rounded-lg text-xs font-bold bg-amber-500 text-white shadow-sm cursor-pointer" : "py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer";
        if (btn2) btn2.className = score === 2 ? "py-1.5 px-2 rounded-lg text-xs font-bold bg-indigo-500 text-white shadow-sm cursor-pointer" : "py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer";
        if (btn3) btn3.className = score === 3 ? "py-1.5 px-2 rounded-lg text-xs font-bold bg-emerald-600 text-white shadow-sm cursor-pointer" : "py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer";
      });
    }

    async function submitVote() {
      const userName = document.getElementById('userNameInput').value.trim();
      if (!userName) {
        alert("이름(닉네임)을 입력해 주세요!");
        return;
      }

      if (Object.keys(mySelections).length === 0) {
        alert("최소 1개 이상의 항목을 선택해 주세요!");
        return;
      }

      if (currentCategory === 'final' && Object.keys(mySelections).length < 3) {
        alert("결선 투표는 1순위, 2순위, 3순위를 모두 골라주셔야 합니다!");
        return;
      }

      if (supabaseClient) {
        try {
          await supabaseClient
            .from('votes')
            .delete()
            .eq('category', currentCategory)
            .eq('user_name', userName);

          const newVotes = Object.entries(mySelections).map(([key, val]) => ({
            category: currentCategory,
            user_name: userName,
            rank_1: key,
            rank_2: String(val)
          }));

          const { error } = await supabaseClient.from('votes').insert(newVotes);

          if (error) {
            alert("저장 실패: " + error.message);
            return;
          }

          alert("🎉 투표가 성공적으로 저장되었습니다!");
          loadDataFromSupabase();
        } catch (err) {
          alert("제출 중 오류 발생: " + err.message);
        }
      } else {
        alert("DB 연동 상태가 아닙니다.");
      }
    }

    async function resetFinalVotesOnly() {
      if (!confirm("⚠️ 2차 결선 투표 기록만 초기화하시겠습니까?\n(1차 투표 기록은 안전하게 보존됩니다.)")) return;

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient
            .from('votes')
            .delete()
            .eq('category', 'final');

          if (error) {
            alert("초기화 실패: " + error.message);
            return;
          }
          
          votes = votes.filter(v => v.category !== 'final');
          mySelections = {};
          renderAccommodations();
          renderResults();
          alert("🔄 2차 결선 투표 데이터가 초기화되었습니다!");
        } catch (err) {
          alert("초기화 오류: " + err.message);
        }
      }
    }

    async function resetComoVotesOnly() {
      if (!confirm("⚠️ 꼬모 3차 투표 기록만 초기화하시겠습니까?\n(7박·3박 후보 및 결선 투표 기록은 보존됩니다.)")) return;
      if (!supabaseClient) return alert("DB 연동 상태가 아닙니다.");
      try {
        const { error } = await supabaseClient.from('votes').delete().eq('category', 'como');
        if (error) return alert("초기화 실패: " + error.message);
        votes = votes.filter(v => v.category !== 'como');
        mySelections = {};
        renderAccommodations();
        renderResults();
        alert("🔄 꼬모 3차 투표 데이터만 초기화되었습니다!");
      } catch (err) {
        alert("초기화 오류: " + err.message);
      }
    }

    async function resetAllVotes() {
      if (!confirm("⚠️ 정말로 모든 투표(1차 + 2차 + 3차) 기록을 초기화하시겠습니까?")) return;

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.from('votes').delete().neq('id', '00000000-0000-0000-0000-000000000000');
          if (error) {
            alert("초기화 실패: " + error.message);
            return;
          }
          votes = [];
          mySelections = {};
          renderAccommodations();
          renderResults();
          alert("💥 1차·2차·3차 전체 투표 데이터가 초기화되었습니다!");
        } catch (err) {
          alert("초기화 오류: " + err.message);
        }
      }
    }

    function renderResults() {
      const board = document.getElementById('resultsBoard');
      if (!board) return;

      const categoryVotes = votes.filter(v => v.category === currentCategory);

      if (currentCategory === 'final') {
        let userMap = {};
        categoryVotes.forEach(v => {
          if (!userMap[v.user_name]) userMap[v.user_name] = [];
          
          const comboObj = FINAL_COMBOS.find(c => c.id === v.rank_1);
          const comboName = comboObj ? comboObj.name : v.rank_1;
          const rankNum = parseInt(v.rank_2) || 99;

          userMap[v.user_name].push({
            rank: rankNum,
            name: comboName
          });
        });

        const users = Object.keys(userMap);

        if (users.length === 0) {
          board.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">아직 제출된 결선 투표가 없습니다.</p>`;
          return;
        }

        board.innerHTML = `
          <div class="text-xs text-slate-500 mb-3">총 결선 참여: <span class="font-bold text-indigo-600">${users.length}명</span></div>
          <div class="space-y-3">
            ${users.map(userName => {
              const orderedList = userMap[userName].sort((a, b) => a.rank - b.rank);
              
              return `
                <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-1.5">
                  <div class="font-bold text-xs text-indigo-700 flex items-center gap-1">
                    <span>👤</span> <span>${userName}</span>
                  </div>
                  <div class="space-y-1 text-xs">
                    ${orderedList.map(item => {
                      const badgeClass = item.rank === 1 ? 'bg-amber-500 text-white font-bold' : item.rank === 2 ? 'bg-slate-500 text-white font-bold' : 'bg-amber-800 text-white font-bold';
                      return `
                        <div class="flex items-center justify-between bg-white px-2.5 py-1 rounded border border-slate-100">
                          <span class="text-[10px] px-1.5 py-0.5 rounded ${badgeClass}">${item.rank}순위</span>
                          <span class="font-semibold text-slate-800">${item.name}</span>
                        </div>
                      `;
                    }).join('')}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      } else {
        const filteredAcc = accommodations.filter(a => a.category === currentCategory);
        let scores = {};
        filteredAcc.forEach(a => scores[a.id] = 0);
        const uniqueUsers = new Set(categoryVotes.map(v => v.user_name)).size;

        categoryVotes.forEach(v => {
          const accId = v.rank_1;
          const score = parseInt(v.rank_2) || 0;
          if (scores[accId] !== undefined) scores[accId] += score;
        });

        const sorted = filteredAcc.map(a => ({ ...a, score: scores[a.id] || 0 }))
                                  .sort((a, b) => b.score - a.score);
        const maxScore = Math.max(...sorted.map(s => s.score), 1);

        board.innerHTML = `
          <div class="text-xs text-slate-500 mb-2">총 평가 참여: <span class="font-bold text-indigo-600">${uniqueUsers}명</span></div>
          ${sorted.map((item, idx) => `
            <div class="space-y-1">
              <div class="flex justify-between text-xs font-semibold">
                <span class="truncate max-w-[150px]">${idx === 0 && item.score > 0 ? '👑 ' : ''}${item.name}</span>
                <span class="text-indigo-600 font-bold">${item.score}점</span>
              </div>
              <div class="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                <div class="bg-indigo-600 h-2 rounded-full transition-all duration-300" style="width: ${(item.score / maxScore) * 100}%"></div>
              </div>
            </div>
          `).join('')}
        `;
      }
    }

    function toggleAddModal() {
      document.getElementById('addModal').classList.toggle('hidden');
    }

    async function addAccommodation() {
      const name = document.getElementById('newName').value.trim();
      if (!name) return alert("숙소 이름을 입력해 주세요.");

      const newAcc = {
        category: currentCategory,
        name: name,
        location: document.getElementById('newLocation').value.trim(),
        price: document.getElementById('newPrice').value.trim(),
        bedrooms: document.getElementById('newBedrooms').value.trim(),
        beds: document.getElementById('newBeds').value.trim(),
        bathrooms: document.getElementById('newBathrooms').value.trim(),
        features: document.getElementById('newFeatures').value.trim(),
        url: document.getElementById('newUrl').value.trim(),
        img: document.getElementById('newImg').value.trim() || 'https://raw.githubusercontent.com/neoneo3817/travel-vote/main/1.jpg'
      };

      if (supabaseClient) {
        const { error } = await supabaseClient.from('accommodations').insert([newAcc]);
        if (error) {
          alert("숙소 추가 실패: " + error.message);
          return;
        }
        loadDataFromSupabase();
      }

      toggleAddModal();
      alert("새 숙소가 추가되었습니다!");
    }
  </script>
</body>
</html>
