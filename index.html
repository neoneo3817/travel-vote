<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>돌로미티 숙소 결정 투표</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 pb-20">

  <!-- Header -->
  <header class="bg-indigo-600 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-lg font-bold">🏔️ 돌로미티 숙소 결정 투표</h1>
      <span class="text-xs bg-indigo-700 px-2.5 py-1 rounded-full border border-indigo-400">정상 작동 중 🟢</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">
    
    <!-- User Input Section -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
      <label class="block text-sm font-semibold text-slate-700 mb-2">👤 당신의 이름 (투표자 닉네임):</label>
      <input type="text" id="userNameInput" placeholder="예: 홍길동" class="w-full md:w-64 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
    </div>

    <!-- Category Tabs -->
    <div class="flex border-b border-slate-200 bg-white rounded-t-xl overflow-hidden shadow-sm">
      <button id="tab7nights" onclick="switchCategory('7nights')" class="flex-1 py-3 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer">
        🗓️ 7박 코스 (9/11 ~ 9/18)
      </button>
      <button id="tab3nights" onclick="switchCategory('3nights')" class="flex-1 py-3 font-bold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 cursor-pointer">
        🗓️ 3박 코스 (9/18 ~ 9/21)
      </button>
    </div>

    <!-- Main Content Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Accommodations List -->
      <div class="lg:col-span-2 space-y-4">
        <h2 class="text-lg font-bold text-slate-800">🏡 숙소 후보 리스트</h2>
        <div id="accommodationsList" class="space-y-4"></div>

        <button onclick="submitVote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition cursor-pointer mt-4">
          🗳️ 선택한 순위로 투표 제출하기
        </button>
      </div>

      <!-- Live Dashboard -->
      <div class="lg:col-span-1">
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 sticky top-4">
          <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center gap-2">
            📊 현황 판
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
          </h2>
          <div id="resultsBoard" class="space-y-3"></div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const PRESET_DATA = [
      { id: '1', category: '7nights', name: '1. Trafuns HOF 아파트', location: '볼차노', price: '190만', bedrooms: '2', beds: '2', bathrooms: '1', features: '발코니 뷰 끝내줌', url: 'https://www.trafunshof.com/en/online-booking', img: './1.jpg' },
      { id: '2', category: '7nights', name: '2. Innergost Hof 롯지', location: '볼차노', price: '170만', bedrooms: '2', beds: '2', bathrooms: '1', features: '발코니 뷰 끝내줌. 아직 예약 안열림', url: 'https://www.innergosthof.com/en/', img: './2.jpg' },
      { id: '3', category: '7nights', name: '3. Oberzerod 아파트', location: '볼차노', price: '220만', bedrooms: '2', beds: '2', bathrooms: '2', features: '발코니 뷰 끝내줌', url: 'https://www.oberzerod.com/en/living/panorama/', img: './3.jpg' },
      { id: '4', category: '7nights', name: '4. Seis am Schlern 콘도', location: '볼차노', price: '220만', bedrooms: '3', beds: '3', bathrooms: '1', features: '발코니 뷰 끝내줌', url: 'https://www.airbnb.co.kr/rooms/51579894', img: './4.jpg' },
      { id: '5', category: '7nights', name: '5. Caprile-Alleghe 집', location: '볼차노', price: '250만', bedrooms: '2', beds: '3', bathrooms: '2', features: '발코니 산악뷰 끝내줌', url: 'https://www.airbnb.co.kr/rooms/1421801906851702421', img: './5.jpg' },
      { id: '6', category: '7nights', name: '6. Pecol 살레', location: '볼차노', price: '310만', bedrooms: '3', beds: '3', bathrooms: '2', features: '발코니 산악뷰 좋음', url: 'https://www.airbnb.co.kr/rooms/45331024', img: './6.jpg' },
      { id: '7', category: '7nights', name: '7. Sass Dlacia 캠핑장 롯지', location: '친퀘토리', price: '300만', bedrooms: '2', beds: '2+소파베드1', bathrooms: '1', features: '대형 캠핑장 각종 시설 사용 가능', url: 'https://campingsassdlacia.it/en', img: './7.jpg' },
      { id: '8', category: '7nights', name: '8. La Villa 아파트 (크레파츠)', location: '친퀘토리', price: '210만', bedrooms: '2', beds: '3', bathrooms: '1', features: '산악뷰 끝내주나 집 뒷편임', url: 'https://www.airbnb.co.kr/rooms/794028618594637814', img: './8.jpg' },
      { id: '9', category: '7nights', name: '9. San Ciascian 아파트 (알타 바디아)', location: '친퀘토리', price: '230만', bedrooms: '1', beds: '2', bathrooms: '1', features: '마당 잔디밭', url: 'https://www.airbnb.co.kr/rooms/1700733378054490736', img: './9.jpg' },
      { id: '10', category: '7nights', name: '10. La Villa 아파트', location: '친퀘토리', price: '290만', bedrooms: '2', beds: '3', bathrooms: '1', features: '발코니 뷰 끝내줌', url: 'https://www.airbnb.co.kr/rooms/31139263', img: './10.jpg' },
      { id: '11', category: '3nights', name: '11. Fie allo Scillar 아파트 (오팔)', location: '볼차노', price: '120만', bedrooms: '1', beds: '2+소파베드1', bathrooms: '1', features: '정원뷰 좋음+완전 신식', url: 'https://www.airbnb.co.kr/rooms/655454393790746501', img: './11.jpg' },
      { id: '12', category: '3nights', name: '12. Vols am Schlern 아파트', location: '볼차노', price: '150만', bedrooms: '2', beds: '3+소파베드1', bathrooms: '2', features: '부엌 산악뷰. 발코니 없음', url: 'https://www.airbnb.co.kr/rooms/39777287', img: './12.jpg' },
      { id: '13', category: '3nights', name: '13. Vols am Schlern 별장', location: '볼차노', price: '110만', bedrooms: '2', beds: '2+소파베드1', bathrooms: '1', features: '별장 전체 마당의 각종 뷰. 시골집 스타일', url: 'https://www.airbnb.co.kr/rooms/707028084921852031', img: './13.jpg' },
      { id: '14', category: '3nights', name: '14. Badia 아파트', location: '친퀘토리', price: '120만', bedrooms: '2', beds: '4', bathrooms: '2', features: '광폭 발코니 산악 사이드뷰', url: 'https://www.airbnb.co.kr/rooms/1170131398830189930', img: './14.jpg' },
      { id: '15', category: '3nights', name: '15. San Ciascian 아파트', location: '친퀘토리', price: '160만', bedrooms: '2', beds: '3+소파베드1', bathrooms: '1', features: '산악 사이드뷰', url: 'https://www.airbnb.co.kr/rooms/914397442379820144', img: './15.jpg' }
    ];

    let currentCategory = '7nights';
    let mySelection = { rank_1: null, rank_2: null, rank_3: null };
    let savedVotes = [];

    window.addEventListener('DOMContentLoaded', function() {
      renderAccommodations();
      renderResults();
    });

    function switchCategory(cat) {
      currentCategory = cat;
      mySelection = { rank_1: null, rank_2: null, rank_3: null };

      document.getElementById('tab7nights').className = cat === '7nights' 
        ? "flex-1 py-3 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer"
        : "flex-1 py-3 font-bold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 cursor-pointer";

      document.getElementById('tab3nights').className = cat === '3nights' 
        ? "flex-1 py-3 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 cursor-pointer"
        : "flex-1 py-3 font-bold text-center border-b-2 border-transparent text-slate-500 hover:text-slate-700 cursor-pointer";

      renderAccommodations();
      renderResults();
    }

    function renderAccommodations() {
      const listEl = document.getElementById('accommodationsList');
      const filtered = PRESET_DATA.filter(item => item.category === currentCategory);

      listEl.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:border-indigo-300 transition">
          <div class="w-full aspect-[4/3] bg-slate-100 overflow-hidden">
            <img src="${item.img}" alt="${item.name}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=600&q=80';">
          </div>
          <div class="p-4 space-y-2">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs font-semibold px-2 py-0.5 bg-slate-100 text-slate-600 rounded mr-2">\${item.location}</span>
                <h3 class="font-bold text-base text-slate-800 inline">\${item.name}</h3>
              </div>
              <span class="text-indigo-600 font-bold text-sm">\${item.price}</span>
            </div>
            
            <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded">✨ \${item.features}</p>
            
            <div class="flex items-center justify-between text-xs text-slate-500 pt-1">
              <span>🛏️ 침실 \${item.bedrooms} | 침대 ${item.beds} \vert{} 🚿 화장실 ${item.bathrooms}</span>
              <a href="\${item.url}" target="_blank" class="text-indigo-600 underline font-semibold">숙소 상세 보기 🔗</a>
            </div>

            <div class="grid grid-cols-3 gap-2 pt-3 border-t border-slate-100">
              <button onclick="selectRank('${item.id}', 1)" id="btn-1-${item.id}" class="py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">🥇 1순위</button>
              <button onclick="selectRank('${item.id}', 2)" id="btn-2-${item.id}" class="py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">🥈 2순위</button>
              <button onclick="selectRank('${item.id}', 3)" id="btn-3-${item.id}" class="py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer">🥉 3순위</button>
            </div>
          </div>
        </div>
      `).join('');

      updateRankButtons();
    }

    function selectRank(accId, rank) {
      if (mySelection.rank_1 === accId) mySelection.rank_1 = null;
      if (mySelection.rank_2 === accId) mySelection.rank_2 = null;
      if (mySelection.rank_3 === accId) mySelection.rank_3 = null;

      if (rank === 1) mySelection.rank_1 = accId;
      if (rank === 2) mySelection.rank_2 = accId;
      if (rank === 3) mySelection.rank_3 = accId;

      updateRankButtons();
    }

    function updateRankButtons() {
      const filtered = PRESET_DATA.filter(item => item.category === currentCategory);
      filtered.forEach(item => {
        const btn1 = document.getElementById(`btn-1-\${item.id}`);
        const btn2 = document.getElementById(`btn-2-${item.id}`); const btn3 = document.getElementById(`btn-3-${item.id}`);

        if (btn1) btn1.className = mySelection.rank_1 === item.id ? "py-1.5 px-2 rounded-lg text-xs font-bold bg-amber-500 text-white shadow-sm cursor-pointer" : "py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer";
        if (btn2) btn2.className = mySelection.rank_2 === item.id ? "py-1.5 px-2 rounded-lg text-xs font-bold bg-slate-400 text-white shadow-sm cursor-pointer" : "py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer";
        if (btn3) btn3.className = mySelection.rank_3 === item.id ? "py-1.5 px-2 rounded-lg text-xs font-bold bg-amber-700 text-white shadow-sm cursor-pointer" : "py-1.5 px-2 rounded-lg text-xs font-bold border border-slate-200 text-slate-600 hover:bg-slate-50 cursor-pointer";
      });
    }

    function submitVote() {
      const userName = document.getElementById('userNameInput').value.trim();
      if (!userName) {
        alert("이름(닉네임)을 입력해 주세요!");
        return;
      }

      if (!mySelection.rank_1 && !mySelection.rank_2 && !mySelection.rank_3) {
        alert("최소 1개 이상의 순위를 선택해 주세요!");
        return;
      }

      const existingIndex = savedVotes.findIndex(v => v.category === currentCategory && v.userName === userName);
      const voteData = {
        category: currentCategory,
        userName: userName,
        rank_1: mySelection.rank_1,
        rank_2: mySelection.rank_2,
        rank_3: mySelection.rank_3
      };

      if (existingIndex >= 0) {
        savedVotes[existingIndex] = voteData;
      } else {
        savedVotes.push(voteData);
      }

      alert("🎉 투표가 제출되었습니다!");
      renderResults();
    }

    function renderResults() {
      const board = document.getElementById('resultsBoard');
      const filteredAcc = PRESET_DATA.filter(a => a.category === currentCategory);
      const categoryVotes = savedVotes.filter(v => v.category === currentCategory);

      let scores = {};
      filteredAcc.forEach(a => scores[a.id] = 0);

      categoryVotes.forEach(v => {
        if (v.rank_1 && scores[v.rank_1] !== undefined) scores[v.rank_1] += 3;
        if (v.rank_2 && scores[v.rank_2] !== undefined) scores[v.rank_2] += 2;
        if (v.rank_3 && scores[v.rank_3] !== undefined) scores[v.rank_3] += 1;
      });

      const sorted = filteredAcc.map(a => ({ ...a, score: scores[a.id] || 0 }))
                                .sort((a, b) => b.score - a.score);

      const maxScore = Math.max(...sorted.map(s => s.score), 1);

      board.innerHTML = `
        <div class="text-xs text-slate-500 mb-2">총 투표 참여: <span class="font-bold text-indigo-600">\${categoryVotes.length}명</span></div>
        \${sorted.
